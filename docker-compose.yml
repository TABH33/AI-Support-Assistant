services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: telematics_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama
    container_name: telematics_ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/11434' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: telematics_backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SESSION_TIMEOUT_MINUTES: ${SESSION_TIMEOUT_MINUTES}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      # Route-planning feature (OpenRouteService directions + geocoding).
      # Optional: an empty/absent value is treated as "not configured" by
      # app/integrations/openrouteservice.py, which degrades POST /route-plan
      # and the chat route-plan intent to "route data unavailable" rather
      # than erroring. This service enumerates every env var explicitly (no
      # env_file:), so a var missing HERE never reaches the container even
      # when it is set in the host .env -- keep this list in sync with
      # backend/.env.example.
      ORS_API_KEY: ${ORS_API_KEY:-}
      # Opt-in chat escalation email (app/integrations/email.py). All
      # optional: an empty SMTP_HOST is treated as "not configured" -- the
      # escalation ticket is still created, only the email is skipped
      # (email_sent=false). Listed here for the same reason as ORS_API_KEY
      # above: a var missing from this block never reaches the container.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      ESCALATION_EMAIL_TO: ${ESCALATION_EMAIL_TO:-CIHE241731@student.edu.cihe.au}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: telematics_frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data:
